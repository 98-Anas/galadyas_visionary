[project]
name = "galadyas-visionary"
version = "1.0.0rc1"
description = "Make polished product, marketing and report videos from templates, offline. Desktop studio plus a Python API."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "imageio-ffmpeg>=0.5",
    "pyside6>=6.6",
    "numpy>=1.24",
]

[project.scripts]
galadyas-visionary = "galadyas_visionary.cli:main"

[project.gui-scripts]
galadyas-visionary-studio = "galadyas_visionary.gui.app:main"

[project.optional-dependencies]
manim = ["manim>=0.18"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galadyas_visionary"]
